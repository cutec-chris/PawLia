providers:
  ollama:
    backend: pawlia
    apiBase: http://localhost:11434/v1
    apiKey: ollama
    timeout: 240
    keepAlive: -1
  # Hermes is an alternative *brain*, not a tool: a provider with
  # `backend: hermes` makes the RouterAgent hand the whole turn to an external
  # Hermes server (which keeps its own tools/context) instead of PawLia's local
  # ChatAgent stack. PawLia stays the interface + logging + memory layer.
  # Enable this as a fallback when the local stack misbehaves — point a model at
  # this provider (see the `hermes:` model below) and assign it to `chat`.
  # hermes_local:
  #   backend: hermes
  #   apiBase: http://127.0.0.1:8642/v1
  #   apiKey: change-me
  #   timeout: 600
  #   conversation_namespace: pawlia
  #   store: true
  # groq:
  #   backend: pawlia
  #   apiBase: https://api.groq.com/openai/v1
  #   apiKey: gsk_...

# Named model definitions.  Each entry bundles a model name, provider, and
# generation parameters.  Agent types and skills reference these by key.
models:
  fast:
    model: qwen3.5:4b
    provider: ollama
    temperature: 0.7
  # smart:
  #   model: qwen3.5:latest
  #   provider: ollama
  #   temperature: 0.9
  #   think: true
  # vision:
  #   model: qwen2.5vl:latest
  #   provider: ollama
  # groq-fast:
  #   model: qwen3:4b
  #   provider: groq
  #   temperature: 0.3
  # gemma4:
  #   model: gemma4:latest
  #   provider: ollama
  #   temperature: 0.3
  #   audio_input: true    # native audio — skips STT, sends audio directly to the model
  # hermes:
  #   model: hermes-agent
  #   provider: hermes_local

# Assign a model (by key) to each agent type.
# You can provide multiple models comma-separated to enable runtime failover,
# e.g. `chat: smart,fast` (tries smart first, then fast if it errors).
# Fallback chain: chat/vision/skill_runner → default
#                 skill.<name> → skill_runner → default
# Note: skill_runner and skills are optional — if omitted, they fall back to chat.
#       Session overrides set via /model chat also propagate to skills automatically.
agents:
  default: fast       # global fallback — must point to a key in models:
  # chat: smart,fast
  # skill_runner: fast   # optional — inherits chat if omitted
  # vision: vision
  # skills:              # per-skill overrides (optional)
  #   searxng: groq-fast,fast
  #   browser: smart,fast

interfaces:
  # Remove the comment to enable an interface.

  # web:
  #   port: 8888          # Web-UI with chat, provider & model management
  #   # token: mysecret   # optional — auto-generated and printed to console if omitted

  # webhook:
  #   port: 8080

  # telegram:
  #   token: YOUR_TELEGRAM_BOT_TOKEN

  # matrix:
  #   homeserver: https://matrix.org
  #   user_id: "@yourbot:matrix.org"
  #   password: YOUR_PASSWORD
  #   # access_token: OR_USE_THIS_INSTEAD_OF_PASSWORD
  #   # always_thread: true                  # always reply in a new thread (default: false)
  #   # allowed_users:                       # who may invite the bot (default: first inviter wins)
  #   #   - "@you:matrix.org"
  #   # stun_servers:                        # STUN for VoIP (optional)
  #   #   - stun:stun.l.google.com:19302

  # discord:
  #   token: YOUR_BOT_TOKEN                # Discord bot token from Developer Portal
  #   # allowed_users:                      # optional — restrict to these Discord user IDs
  #   #   - "123456789012345678"
  #   # allowed_channels:                   # optional — restrict to these channel IDs
  #   #   - "987654321098765432"
  #   # always_thread: true                 # auto-reply in threads (default: true)
  #   # require_mention: false              # only respond to @mention (default: false)
  #   # slash_commands: true                # register slash commands (default: true)
  #   # voice:                              # voice channel support (default: enabled)
  #   #   enabled: true                     # set to false to disable voice channels
  #   #   silence_threshold: 1.5            # seconds of silence to end utterance
  #   #   min_speech_duration: 0.5          # minimum seconds of speech to process
  #   #   timeout: 300                      # auto-disconnect after inactivity (seconds)

  # openai:                                  # OpenAI- & Ollama-compatible REST API
  #   port: 11435                            # POST /v1/chat/completions, GET /v1/models
  #   # host: 0.0.0.0                        # GET /api/tags, POST /api/chat (Ollama format)
  #   # api_key: mysecret                    # optional — require Bearer token

# voip:
#   silence_threshold: 0.018          # frame RMS above this counts as speech (after AGC)
#   silence_emphasis_factor: 2.0      # base multiplier for adaptive threshold
#                                       # (auto-scaled down to 1.2 in noisy environments)
#   silence_seconds: 2.2              # trailing silence that ends a chunk
#   min_speech_seconds: 0.4           # shorter chunks are discarded early
#   min_active_speech_ratio: 0.12     # fraction of active frames required per chunk
#   min_consecutive_speech_frames: 8  # sustained active 20ms frames required
#   min_speech_band_ratio: 0.35       # energy share in the speech band
#   max_spectral_flatness: 0.72       # reject very noise-like chunks
#   min_speech_modulation: 0.7        # in loud environments only: required envelope
#                                       # modulation (CoV) — rejects steady wind/road
#                                       # noise that energy/spectral gates miss
#   min_speech_like_ratio: 0.08       # active + speech-like frame ratio required
#   min_consecutive_speechlike_frames: 4
#   speech_pause_ratio: 0.35          # frame below this fraction of the running speech
#                                       # level counts as a pause even if spectrally
#                                       # speech-like — lets chunks close in wind (0 = off)
#   min_resume_speech_frames: 3       # consecutive speech-like frames to break a running pause
#                                       # (auto-scaled up in noisy environments — see adaptive silence)
#   vad_max_chunk_seconds: 15          # force-flush open speech buffer after this many seconds
#                                       # (safety net so sustained wind can't hold a chunk open; 0 = disabled)
#   pre_speech_seconds: 0.6           # prepend this much audio before detected speech (onset safety)
#   webrtcvad_enabled: true           # extra lightweight speech detector
#   webrtcvad_mode: 2                 # 0..3, higher = stricter
#   webrtcvad_min_voiced_ratio: 0.12  # voiced-frame ratio required if enabled
#   webrtcvad_min_consecutive_frames: 4
#   call_inactivity_seconds: 180      # hang up if nothing is sent to STT for this long
#   response_delay_seconds: 2.5       # wait this long after speech ends before replying
#   agc_window_seconds: 15.0          # keep AGC active this long after bot/user activity
#   agc_target_rms: 0.10              # target loudness used for VAD normalization (bot active)
#   agc_quiet_target_rms: 0.06        # target loudness when bot is idle (boosts quiet speech)
#   agc_max_gain: 12.0                # upper cap for AGC amplification
#   agc_smoothing: 0.15               # how quickly AGC reacts (higher = faster)
#   bargein_rms_threshold: 0.05       # raw RMS to interrupt TTS playback
#   preanswer_warmup_enabled: true    # warm STT + prepare greeting before answering calls
#   preanswer_warmup_timeout_seconds: 25.0
#   preanswer_stt_silence_seconds: 0.4
#   recording:
#     enabled: false                  # opt-in: record full calls as WAV/FLAC (default: false)
#                                     # note: always enabled when log level is DEBUG
#     directory: log/call_recordings  # where to store recordings
#     compress_flac: true             # convert WAV to FLAC after call ends
#     retention_days: 7               # delete recordings older than this many days

# Speech-to-text transcription (voice messages + VoIP calls).
# Any OpenAI-compatible /audio/transcriptions endpoint works.
#
# Explicitly list the STT providers PawLia may use. This list is the fallback
# order; PawLia does not try every configured provider automatically.
# Use one entry for no fallback, or multiple entries for fallback.
# transcription:
#   providers:
#     - name: lan-whisper
#       provider: local
#       base_url: http://localhost:8005/v1
#       model: deepdml/faster-whisper-large-v3-turbo-ct2
#       language: de
#       timeout: 10
#     - groq
#
#   # After 3 runtime failures, a provider is skipped for 30 minutes.
#   # Entries may be provider names (like `groq`) or inline provider configs
#   # (like `lan-whisper` above).
#
#   groq:
#     api_key: YOUR_GROQ_API_KEY
#     model: whisper-large-v3-turbo
#     # base_url: https://api.groq.com/openai/v1   # set automatically; override if needed
#     language: de
#     timeout: 30
#
#   # Other available provider configs, only used if listed in `providers`.
#   # openai:
#   #   api_key: YOUR_API_KEY
#   #   base_url: https://api.openai.com/v1
#   #   model: whisper-1
#
#   # local:
#   #   # No base_url: use in-process faster-whisper (requires FFmpeg + faster-whisper)
#   #   model: base        # tiny | base | small | medium | large-v3
#   #   device: cpu        # cpu | cuda
#   #   compute_type: int8
#   #   language: de

# Text-to-speech for VoIP call responses — pick one provider and uncomment it.
# tts:
#   provider: piper                # local TTS, no internet needed (model pre-installed in Docker)
#   piper:
#     executable: piper
#     model: /app/piper/de_DE-kerstin-low.onnx
#     config: /app/piper/de_DE-kerstin-low.onnx.json
#     sample_rate: 16000
#
#   # provider: edge               # Microsoft Edge TTS (requires internet)
#   # edge:
#   #   voice: de-DE-KatjaNeural   # run `edge-tts --list-voices` for options
#
#   # hold_audio: /app/assets/keyboard.m4a   # background sound while waiting for agent (default: assets/keyboard.m4a)

# Workspace settings — the workspace directory (session/<user>/workspace/) is
# an Obsidian vault.  Enable git to auto-commit changes and keep the repo small
# with daily/weekly squash.
workspace:
  git:
    enabled: false                 # auto-commit workspace changes via git
    # daily_squash_time: "23:00"   # squash all daily commits into one (default: 23:00)
    # weekly_squash_day: 6         # 0=Mon..6=Sun (default: 6 = Sunday)
    # weekly_squash_time: "23:30"  # squash all weekly commits into one (default: 23:30)
    # push: false                  # push to remote after squash (uses --force-with-lease)

# CalDAV/CardDAV server — maps Radicale login names to picoclaw user_ids.
# Login name = htpasswd username = first URL path component (e.g. /chris/calendar/).
# Add users to radicale/users with: htpasswd -B -b radicale/users chris mypassword
# caldav:
#   users:
#     chris: cli_user          # simple name → user_id
#     anna: anna_user

# Workspace context search — on each substantive user message, PawLia runs a
# BM25 keyword search across workspace markdown files and injects only concise
# file/section pointers into the next user message. No indexing, no embeddings.
# Disabled by default. Uncomment and set enabled to turn on.
# workspace-search:
#   enabled: true       # set to true to enable
#   top_k: 3            # max candidate sections to inject
#   min_score: 0.7      # minimum fraction of the best hit score (0–1)
#   min_raw_score: 2.0  # absolute BM25 floor; weak best hits are ignored
#   snippet_chars: 100  # characters to show per matched section
#   exclude_dirs:       # subdirs of workspace/ to skip (raw chat logs are noisy)
#     - memory
#   include_root_files: true  # include loose .md files directly under workspace/

skill-install:
  allow_remote: false      # allow skill installation via Matrix/Telegram file upload
  allow_workspace: true    # load skills from session/<user>/workspace/skills/ (default: true)

skill-config:
  # searxng:
  #   url: http://localhost:8888
  #   timeout: 10

  # perplexica:
  #   url: http://localhost:3000
  #   # optional: override auto-detected models
  #   # chat_model_provider: Groq
  #   # chat_model: llama-3.1-8b-instant
  #   # embedding_model_provider: Transformers
  #   # embedding_model: Xenova/all-MiniLM-L6-v2

  # researcher:                          # Research projects
  #   embedding_provider: ollama
  #   embedding_model: bge-m3:latest
  #   embedding_dim: 1024
  #   embedding_host: http://localhost:11434
  #   # rag_backend: markdown            # markdown (default) | lightrag | simple
  #   # rag_provider: ollama             # defaults to embedding_provider
  #   # rag_model: qwen3.5:latest        # LLM for topic extraction / RAG (not used by simple)
  #   # rag_numctx: 4096                 # LLM context window (lightrag/markdown)
  #   # rag_timeout: 600                 # LLM timeout in seconds
  #   # rag_embedding_timeout: 120       # embedding timeout in seconds (lightrag/simple)
  #   # rag_max_async_llm: 1             # max parallel LLM requests (lightrag only)
  #   # rag_max_async_embedding: 1       # max parallel embedding requests (lightrag/simple)

  # memory:                              # Long-term conversation memory
  #   embedding_provider: ollama
  #   embedding_model: bge-m3:latest
  #   embedding_dim: 1024
  #   embedding_host: http://localhost:11434
  #   # rag_backend: markdown            # markdown (default) | lightrag | simple
  #   #                                  #   markdown  — LLM extracts topics → one .md file per topic, keyword retrieval
  #   #                                  #   lightrag  — knowledge-graph RAG (powerful, slow, needs lightrag-hku)
  #   #                                  #   simple    — chunk + embed + cosine similarity (fast, no extra deps)
  #   # rag_provider: ollama             # defaults to embedding_provider
  #   # rag_model: qwen3.5:latest        # LLM for topic extraction / RAG (not used by simple)
  #   # rag_numctx: 4096                 # LLM context window (lightrag/markdown)
  #   # rag_timeout: 600                 # LLM timeout in seconds
  #   # rag_embedding_timeout: 120       # embedding timeout in seconds (lightrag/simple)
  #   # rag_max_async_llm: 1             # max parallel LLM requests (lightrag only)
  #   # rag_max_async_embedding: 1       # max parallel embedding requests (lightrag/simple)
  #   # idle_minutes: 20                 # min idle time before indexing starts (0 = index ASAP)
