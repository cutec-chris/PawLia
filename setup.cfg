[tool:pytest]
# auto mode: async test functions run without an explicit @pytest.mark.asyncio
# (existing markers stay harmless). New system tests can drop the marker entirely.
# Config lives here (tracked) rather than pytest.ini (gitignored) so CI uses it too.
asyncio_mode = auto
testpaths = tests
addopts = --cov=pawlia --cov-report=term-missing:skip-covered
filterwarnings =
    ignore::DeprecationWarning
