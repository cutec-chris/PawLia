services:
  radicale:
    build:
      context: ./radicale
    restart: unless-stopped
    ports:
      - "127.0.0.1:5232:5232"
    environment:
      - PICOCLAW_SESSION_DIR=/session
      - PICOCLAW_CONFIG=/config.yaml
    volumes:
      # Shared session dir (same mount point as pawlia uses for /app/session)
      - ./session:/session
      # Main config — read caldav.users mapping from here
      - ./config.yaml:/config.yaml:ro
      # htpasswd — add users with: htpasswd -B -b radicale/users <login> <password>
      - ./radicale/users:/radicale/users:ro

  ollama:
    image: ollama/ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ./ollama:/root/.ollama
    # --- GPU support (uncomment ONE section) ---
    # NVIDIA (requires nvidia-container-toolkit):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    # AMD ROCm:
    # devices:
    #   - /dev/kfd
    #   - /dev/dri

  pawlia:
    build:
      context: .
      dockerfile: Dockerfile.voip
    restart: unless-stopped
    network_mode: host
    environment:
      # Make the container's wall-clock match the users' region. With an empty
      # TZ the container runs in UTC, so the scheduler's server-local fallback
      # (and bash `date` in skills) is +2h off in summer — reminders fire late.
      # Setting it here means server time == user time, so times never need
      # "un-bending". Per-user timezones still override this via user.timezone.
      - TZ=Europe/Berlin
    labels:
      autoheal: "true"
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:8888/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    #ports:
    #  - "127.0.0.1:8888:8888"   # Web UI
    #  - "127.0.0.1:8080:8080" # Webhooks
    # --- Debugging (uncomment to enable) ---
    # command: ["python", "-m", "pawlia", "--mode", "server", "--debug"]
    # volumes below include a log mount for prompt logs when debugging
    volumes:
      # Required: your config (copy from config.sample.yaml and fill in)
      - ./config.yaml:/app/config.yaml
      # Persistent session data (memory, etc.)
      - ./session:/app/session
      # Debug logs (uncomment together with --debug above)
      # - ./log:/app/log
