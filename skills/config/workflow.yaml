skill: config
version: '1.0'
compiled_at: '2026-05-19'
compiled_by: glm-5.1
workflows:
- id: config_management
  trigger: User wants to view or modify configuration settings
  max_steps: 5
  building_blocks:
  - id: show_all
    command: python {scripts_dir}/config.py show
    description: Zeigt alle konfigurierbaren Abschnitte an
    status_desc: Zeige alle Einstellungen
    verify:
      exit_code: 0
  - id: show_section
    command: python {scripts_dir}/config.py show --section {section}
    description: Zeigt einen einzelnen Konfigurationsabschnitt
    status_desc: Zeige Abschnitt {section}
    verify:
      exit_code: 0
  - id: get_value
    command: python {scripts_dir}/config.py get --path {path}
    description: Liest einen spezifischen Konfigurationswert
    status_desc: Lese Wert {path}
    verify:
      exit_code: 0
  - id: set_value
    command: python {scripts_dir}/config.py set --path {path} --value {value}
    description: Setzt einen Konfigurationswert
    status_desc: Setze {path} auf {value}
    verify:
      exit_code: 0
  - id: set_value_force
    command: python {scripts_dir}/config.py set --path {path} --value {value} --force
    description: Setzt einen Wert trotz Validierungsfehlern
    status_desc: Setze {path} auf {value} (Force)
    verify:
      exit_code: 0
  - id: model_show
    command: python {scripts_dir}/config.py model
    description: Zeigt das aktuelle Modell‑Override und das aktive Modell
    status_desc: Zeige aktuelles Modell
    verify:
      exit_code: 0
  - id: model_set
    command: python {scripts_dir}/config.py model --name {model_name}
    description: Überschreibt das Chat‑Modell für die aktuelle Session
    status_desc: Setze Modell auf {model_name}
    verify:
      exit_code: 0
  - id: agent_show
    command: python {scripts_dir}/config.py agent
    description: Listet alle Session‑Overrides für Agenten auf
    status_desc: Zeige Agent‑Overrides
    verify:
      exit_code: 0
  - id: agent_show_path
    command: python {scripts_dir}/config.py agent --path {path}
    description: Zeigt den Override‑Wert eines bestimmten Agent‑Pfads
    status_desc: Zeige Agent‑Pfad {path}
    verify:
      exit_code: 0
  - id: agent_set
    command: python {scripts_dir}/config.py agent --path {path} --value {value}
    description: Setzt einen Agent‑Override‑Pfad
    status_desc: Setze Agent‑Pfad {path} auf {value}
    verify:
      exit_code: 0
  - id: agent_off
    command: python {scripts_dir}/config.py agent --path {path} --off
    description: Entfernt einen Agent‑Override‑Pfad
    status_desc: Deaktiviere Agent‑Pfad {path}
    verify:
      exit_code: 0
  - id: voice_show
    command: python {scripts_dir}/config.py voice
    description: Zeigt aktuelle Stimme und verfügbare Stimmen des Providers
    status_desc: Zeige aktuelle Stimme
    verify:
      exit_code: 0
  - id: voice_set
    command: python {scripts_dir}/config.py voice --name {voice_name}
    description: Setzt die TTS‑Stimme für den aktuellen Nutzer
    status_desc: Setze Stimme auf {voice_name}
    verify:
      exit_code: 0
  - id: voice_set_force
    command: python {scripts_dir}/config.py voice --name {voice_name} --force
    description: Setzt die Stimme trotz fehlender Validierung
    status_desc: Setze Stimme auf {voice_name} (Force)
    verify:
      exit_code: 0
  - id: voice_off
    command: python {scripts_dir}/config.py voice --off
    description: Entfernt die Stimm‑Überschreibung
    status_desc: Stimme zurücksetzen
    verify:
      exit_code: 0
  - id: private_enable
    command: python {scripts_dir}/config.py private
    description: Aktiviert privaten Modus für die aktuelle Session
    status_desc: Privaten Modus aktivieren
    verify:
      exit_code: 0
  - id: private_thread_enable
    command: python {scripts_dir}/config.py private --thread {thread_id}
    description: Aktiviert privaten Modus für einen spezifischen Thread
    status_desc: Privaten Modus für Thread {thread_id} aktivieren
    verify:
      exit_code: 0
  - id: private_disable
    command: python {scripts_dir}/config.py private --off
    description: Deaktiviert privaten Modus für die aktuelle Session
    status_desc: Privaten Modus deaktivieren
    verify:
      exit_code: 0
  - id: private_thread_disable
    command: python {scripts_dir}/config.py private --thread {thread_id} --off
    description: Deaktiviert privaten Modus für einen spezifischen Thread
    status_desc: Privaten Modus für Thread {thread_id} deaktivieren
    verify:
      exit_code: 0
  - id: session_show
    command: python {scripts_dir}/config.py session
    description: Zeigt die komplette Session‑Konfiguration
    status_desc: Zeige Session‑Konfiguration
    verify:
      exit_code: 0
  - id: session_section
    command: python {scripts_dir}/config.py session --section {section}
    description: Zeigt einen Abschnitt der Session‑Konfiguration
    status_desc: Zeige Session‑Abschnitt {section}
    verify:
      exit_code: 0
  - id: session_get
    command: python {scripts_dir}/config.py session --get-path {path}
    description: Liest einen spezifischen Wert aus der Session‑Konfiguration
    status_desc: Lese Session‑Wert {path}
    verify:
      exit_code: 0
  - id: session_set
    command: python {scripts_dir}/config.py session --set-path {path} --set-value
      {value}
    description: Schreibt einen Wert in die Session‑Konfiguration
    status_desc: Setze Session‑Wert {path} auf {value}
    verify:
      exit_code: 0
  - id: disabled_list
    command: python {scripts_dir}/config.py disabled-skills
    description: Listet aktuell deaktivierte Skills für die Session
    status_desc: Zeige deaktivierte Skills
    verify:
      exit_code: 0
  - id: disabled_add
    command: python {scripts_dir}/config.py disabled-skills --add {skill}
    description: Deaktiviert einen Skill für die aktuelle Session
    status_desc: Deaktiviere Skill {skill}
    verify:
      exit_code: 0
  - id: disabled_remove
    command: python {scripts_dir}/config.py disabled-skills --remove {skill}
    description: Re‑aktiviert einen zuvor deaktivierten Skill
    status_desc: Re‑aktiviere Skill {skill}
    verify:
      exit_code: 0
  - id: coding_show
    command: python {scripts_dir}/config.py coding
    description: Zeigt das aktuelle Coding‑Backend (skill-creator) und ob opencode/aider
      installiert sind
    status_desc: Zeige Coding‑Backend
    verify:
      exit_code: 0
  - id: coding_set
    command: python {scripts_dir}/config.py coding --backend {backend}
    description: Setzt das Coding‑Backend (opencode|aider|llm|auto) und installiert
      die CLI, falls sie fehlt
    status_desc: Setze Coding‑Backend auf {backend}
    verify:
      exit_code: 0
