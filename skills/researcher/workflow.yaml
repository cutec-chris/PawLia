skill: researcher
version: '2.0'
compiled_at: '2026-05-19'
compiled_by: glm-5.1
workflows:
- id: researcher
  trigger: User wants to create, list, add URLs to, query, delete, or rename a research
    project.
  max_steps: 1
  building_blocks:
  - id: create
    command: python {scripts_dir}/researcher.py create "{name}" "{description}"
    description: Create a new research project with a name and description.
    status_desc: Erstelle Forschungsprojekt "{name}"
  - id: list
    command: python {scripts_dir}/researcher.py list
    description: List all research projects.
    status_desc: Liste Forschungsprojekte auf
  - id: add
    command: python {scripts_dir}/researcher.py add "{project}" "{url}" {depth}
    description: Scrape a URL and save it to the project workspace, with optional
      recursive crawl depth.
    status_desc: Füge {url} zu "{project}" hinzu
  - id: query
    command: python {scripts_dir}/researcher.py query "{project}" "{question}"
    description: Search a project's documents for a question using semantic or keyword
      search.
    status_desc: Suche in "{project}"
  - id: delete
    command: python {scripts_dir}/researcher.py delete "{project}"
    description: Delete a research project.
    status_desc: Lösche Projekt "{project}"
  - id: rename
    command: python {scripts_dir}/researcher.py rename "{old}" "{new}"
    description: Rename a research project.
    status_desc: Benenne "{old}" in "{new}" um
