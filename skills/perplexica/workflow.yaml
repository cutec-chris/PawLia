skill: perplexica
version: '1.0'
compiled_at: '2026-05-19'
compiled_by: glm-5.1
workflows:
- id: perplexica_search
  trigger: User asks a question that requires a web search or explicitly requests
    a Perplexica search.
  max_steps: 1
  building_blocks:
  - id: search
    command: python {scripts_dir}/search.py --query "{query}" --focus {focus_mode}
    description: Runs a Perplexica search with the given query and focus mode, returning
      a JSON answer and sources.
    status_desc: Suche nach "{query}"
    verify:
      exit_code: 0
