skill: files
version: '1.3'
compiled_at: '2026-05-19'
compiled_by: glm-5.1
workflows:
- id: file_operations
  trigger: When the user wants to list, read, write, edit, search, outline, or delete
    files in their workspace.
  max_steps: 5
  goal_check:
    prompt: Did the file operation complete successfully and does the result match
      what the user requested?
    max_retries: 2
  building_blocks:
  - id: list
    command: python {scripts_dir}/files.py list
    description: List all files in the workspace recursively, up to 200 entries.
    status_desc: Liste Dateien auf
  - id: list_more
    command: python {scripts_dir}/files.py list --offset {offset} --limit {limit}
    description: Continue listing files from a given offset when has_more is true.
    status_desc: Liste weitere Dateien ab Offset {offset} auf
  - id: read
    command: python {scripts_dir}/files.py read --filename "{filename}"
    description: Read a file (first 150 lines). Supports wikilink syntax and section
      anchors.
    status_desc: Lese Datei {filename}
  - id: read_block
    command: python {scripts_dir}/files.py read --filename "{filename}" --offset {offset}
      --limit {limit}
    description: Read a file in blocks using line offset and limit.
    status_desc: Lese Datei {filename} ab Zeile {offset}
  - id: read_query
    command: python {scripts_dir}/files.py read --filename "{filename}" --query "{query}"
    description: Query-based reading that returns only matching lines with context.
    status_desc: Durchsuche {filename} nach „{query}"
  - id: write
    command: python {scripts_dir}/files.py write --filename "{filename}"
    description: Write a file. Content is passed via the CONTENT environment variable.
    status_desc: Schreibe Datei {filename}
    env_params:
    - content
  - id: edit
    command: python {scripts_dir}/files.py edit --filename "{filename}"
    description: Edit a file by replacing a unique string. old_string and new_string
      passed via env vars.
    status_desc: Bearbeite Datei {filename}
    env_params:
    - old_string
    - new_string
  - id: edit_replace_all
    command: python {scripts_dir}/files.py edit --filename "{filename}" --replace-all
    description: Edit a file replacing all occurrences of old_string with new_string.
    status_desc: Bearbeite Datei {filename} (alle Vorkommen)
    env_params:
    - old_string
    - new_string
  - id: grep
    command: python {scripts_dir}/files.py grep --pattern "{pattern}"
    description: Search across the entire workspace with a regex pattern.
    status_desc: Durchsuche Workspace nach „{pattern}"
  - id: grep_file
    command: python {scripts_dir}/files.py grep --pattern "{pattern}" --filename "{filename}"
    description: Search within a single file with a regex pattern.
    status_desc: Durchsuche {filename} nach „{pattern}"
  - id: outline
    command: python {scripts_dir}/files.py outline --filename "{filename}"
    description: Get the heading structure of a markdown file.
    status_desc: Zeige Gliederung von {filename}
  - id: read_section
    command: python {scripts_dir}/files.py read-section --filename "{filename}" --section
      "{section}"
    description: Read content under a specific heading up to the next same-or-higher-level
      heading.
    status_desc: Lese Abschnitt „{section}" aus {filename}
  - id: delete
    command: python {scripts_dir}/files.py delete --filename "{filename}"
    description: Delete a file from the workspace.
    status_desc: Lösche Datei {filename}
