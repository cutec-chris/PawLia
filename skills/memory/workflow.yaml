skill: memory
version: '2.0'
compiled_at: '2026-05-19'
compiled_by: glm-5.1
workflows:
- id: memory_operations
  trigger: User asks a question about past conversations or requests a memory management
    command (index, status, dream, lint).
  max_steps: 1
  building_blocks:
  - id: search
    command: python {scripts_dir}/memory.py search "{question}"
    description: Semantic search across all past conversations
    status_desc: Suche Erinnerungen zu "{question}"
    verify:
      exit_code: 0
  - id: index
    command: python {scripts_dir}/memory.py index
    description: Index any new or updated daily chat logs
    status_desc: Indiziere Chat-Verläufe
  - id: dream
    command: python {scripts_dir}/memory.py dream
    description: Process unprocessed chat logs into structured wiki pages with cross-references
    status_desc: Erstelle Wiki-Seiten aus Chat-Verläufen
  - id: lint
    command: python {scripts_dir}/memory.py lint
    description: Wiki health check — merge overlapping pages and fix missing links
    status_desc: Prüfe und repariere Wiki
  - id: status
    command: python {scripts_dir}/memory.py status
    description: Show how many days are indexed
    status_desc: Zeige Index-Status
