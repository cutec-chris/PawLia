skill: organizer
version: '3.1'
compiled_at: '2026-05-19'
compiled_by: glm-5.1
workflows:
- id: organizer-ops
  trigger: User wants to manage reminders, calendar events, tasks, or scheduled automation
    jobs.
  max_steps: 3
  goal_check:
    prompt: Was the reminder, event, task, or job successfully created, listed, completed,
      toggled, or deleted?
    max_retries: 2
  building_blocks:
  - id: add-reminder
    command: python {scripts_dir}/organizer.py add-reminder --fire-at "{fire_at}"
      --message "{message}" --label "{label}" --recurrence {recurrence}
    description: Add a reminder with a fire time, optional label and recurrence.
    status_desc: 'Erinnerung erstellt: {message}'
    verify:
      exit_code: 0
  - id: list-reminders
    command: python {scripts_dir}/organizer.py list-reminders
    description: List all pending reminders.
    status_desc: Liste ausstehende Erinnerungen auf
    verify:
      exit_code: 0
  - id: delete-reminder
    command: python {scripts_dir}/organizer.py delete-reminder --reminder-id "{reminder_id}"
    description: Delete a reminder by title substring.
    status_desc: 'Lösche Erinnerung: {reminder_id}'
    verify:
      exit_code: 0
  - id: add-event
    command: python {scripts_dir}/organizer.py add-event --title "{title}" --start
      "{start}" --end "{end}" --description "{description}" --location "{location}"
      --reminders '{reminders}' --checklist '{checklist}' --recurrence {recurrence}
      --recurrence-days "{recurrence_days}" --recurrence-until "{recurrence_until}"
      --recurrence-count {recurrence_count}
    description: Add a calendar event with optional end, location, recurrence, reminders
      and checklist.
    status_desc: 'Erstelle Termin: {title}'
    verify:
      exit_code: 0
  - id: list-events
    command: python {scripts_dir}/organizer.py list-events --limit {limit}
    description: List upcoming calendar events, optionally limited to N entries.
    status_desc: Liste Termine auf
    verify:
      exit_code: 0
  - id: delete-event
    command: python {scripts_dir}/organizer.py delete-event --event-id "{event_id}"
    description: Delete a calendar event by filename.
    status_desc: 'Lösche Termin: {event_id}'
    verify:
      exit_code: 0
  - id: add-task
    command: python {scripts_dir}/organizer.py add-task --title "{title}" --due-date
      "{due_date}" --priority {priority} --description "{description}" --reminders
      '{reminders}'
    description: Add a task with optional due date, priority, description, and reminders.
    status_desc: 'Erstelle Aufgabe: {title}'
    verify:
      exit_code: 0
  - id: list-tasks
    command: python {scripts_dir}/organizer.py list-tasks --status {status} --limit
      {limit}
    description: List tasks filtered by status (pending/completed/all), optionally
      limited.
    status_desc: Liste Aufgaben auf
    verify:
      exit_code: 0
  - id: complete-task
    command: python {scripts_dir}/organizer.py complete-task --task-id "{task_id}"
    description: Mark a task as completed by title or substring.
    status_desc: 'Schließe Aufgabe ab: {task_id}'
    verify:
      exit_code: 0
  - id: delete-task
    command: python {scripts_dir}/organizer.py delete-task --task-id "{task_id}"
    description: Delete a task by title or substring.
    status_desc: 'Lösche Aufgabe: {task_id}'
    verify:
      exit_code: 0
  - id: add-job
    command: python {scripts_dir}/organizer.py add-job --name "{name}" --instruction
      "{instruction}" --schedule "{schedule}"
    description: Add a scheduled automation job with a name, natural-language instruction,
      and schedule.
    status_desc: 'Erstelle Job: {name}'
    verify:
      exit_code: 0
  - id: list-jobs
    command: python {scripts_dir}/organizer.py list-jobs
    description: List all scheduled automation jobs.
    status_desc: Liste Jobs auf
    verify:
      exit_code: 0
  - id: delete-job
    command: python {scripts_dir}/organizer.py delete-job --job-id "{job_id}"
    description: Delete a scheduled job by ID.
    status_desc: 'Lösche Job: {job_id}'
    verify:
      exit_code: 0
  - id: toggle-job
    command: python {scripts_dir}/organizer.py toggle-job --job-id "{job_id}"
    description: Enable or disable a scheduled job by ID.
    status_desc: 'Schalte Job um: {job_id}'
    verify:
      exit_code: 0
