skill: skill-creator
version: '3.2'
compiled_at: '2026-05-19'
compiled_by: glm-5.1
workflows:
- id: skill-lifecycle
  trigger: Use when the user wants to create, validate, test, compile, package, or
    list agent skills, or manage skill credentials.
  max_steps: 5
  goal_check:
    prompt: Was the requested skill operation completed — skill created/modified,
      validation passed, tests green, compilation done, or credentials managed?
    max_retries: 2
  building_blocks:
  - id: init_skill
    command: python {scripts_dir}/creator.py init --name "{name}" --description "{description}"
      --resources "{resources}" --credentials "{credentials}" --config "{config}"
      --script "{script_type}"
    description: Scaffold a new skill with name, description, and optional resources,
      credentials, config keys, and script language.
    status_desc: Erstelle Skill "{name}"
  - id: validate_skill
    command: python {scripts_dir}/creator.py validate --name "{name}"
    description: Validate a skill's SKILL.md and structure for errors and warnings.
    status_desc: Validiere Skill "{name}"
    verify:
      exit_code: 0
  - id: test_skill
    command: python {scripts_dir}/creator.py test --name "{name}"
    description: Run the skill's harness with real credentials and environment.
    status_desc: Teste Skill "{name}"
    verify:
      exit_code: 0
  - id: compile_skill
    command: python {scripts_dir}/creator.py compile --name "{name}"
    description: Compile SKILL.md into workflow.yaml, skipping if version matches.
    status_desc: Kompiliere Skill "{name}"
    verify:
      exit_code: 0
  - id: compile_skill_force
    command: python {scripts_dir}/creator.py compile --name "{name}" --force
    description: Force recompile SKILL.md into workflow.yaml regardless of version
      match.
    status_desc: Kompiliere Skill "{name}" (erzwungen)
    verify:
      exit_code: 0
  - id: package_skill
    command: python {scripts_dir}/creator.py package --name "{name}"
    description: Package skill into a .skill zip archive.
    status_desc: Verpacke Skill "{name}"
    verify:
      exit_code: 0
  - id: list_skills
    command: python {scripts_dir}/creator.py list
    description: List all skills in workspace and bundled.
    status_desc: Liste alle Skills auf
  - id: cred_set
    command: python {scripts_dir}/credentials.py set --key "{key}" --value "{value}"
    description: Set a credential; response includes value_read_back to verify correctness.
    status_desc: Setze Credential "{key}"
  - id: cred_check
    command: python {scripts_dir}/credentials.py check --keys "{keys}"
    description: Check whether specific credential keys are stored.
    status_desc: Prüfe Credentials "{keys}"
  - id: cred_list
    command: python {scripts_dir}/credentials.py list
    description: List all stored credential keys.
    status_desc: Liste Credentials auf
  - id: cred_delete
    command: python {scripts_dir}/credentials.py delete --key "{key}"
    description: Delete a stored credential by key name.
    status_desc: Lösche Credential "{key}"
  - id: implement_skill
    command: python {scripts_dir}/creator.py implement --name "{name}" --task "{task}"
    description: Implement or rewrite skill scripts using coding backend (aider/opencode/llm).
    status_desc: Implementiere Skill "{name}"
  - id: fix_skill
    command: python {scripts_dir}/creator.py fix --name "{name}" --error "{error}"
      --failed-cmd "{command}"
    description: Debug and fix a failing skill script using coding backend.
    status_desc: Repariere Skill "{name}"
